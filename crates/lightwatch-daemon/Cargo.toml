[package]
name = "lightwatch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ingests lightwatch protocol streams and serves them over HTTP."
autobins = false

[dependencies]
lightwatch-proto = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["io-util", "net", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
