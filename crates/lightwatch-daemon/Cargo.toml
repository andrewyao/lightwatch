[package]
name = "lightwatch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ingests lightwatch protocol streams and serves them over HTTP."

[[bin]]
name = "lightwatch"
path = "src/main.rs"

[dependencies]
lightwatch-proto = { workspace = true }
axum = { version = "0.8.9", features = ["ws"] }
include_dir = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
